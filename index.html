<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Life English · 水果词卡</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#20392c;background:#f5f7f1}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:36px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:25px;margin:0}p{line-height:1.6;color:#64766a}button,.import{font:inherit;border:1px solid #cdd8ce;border-radius:12px;padding:12px 16px;cursor:pointer;background:white;color:#20392c}button:disabled{opacity:.45;cursor:default}button:hover:not(:disabled),.import:hover{background:#eaf0e5}button.primary{background:#285c3c;color:white;border-color:#285c3c}.toolbar,.actions,.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stats{justify-content:space-between;font-size:14px}progress{width:100%;height:9px;accent-color:#285c3c}.card{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:320px;background:#fff;border:1px solid #dbe2d7;border-radius:24px;padding:30px;box-shadow:0 10px 35px #264b3110;text-align:center}.card:hover:not(:disabled){background:#fff}.label{font-size:13px;letter-spacing:2px;color:#718473}.word{font-size:clamp(26px,6vw,46px);font-weight:650;margin:22px 0}.context{font-size:15px;color:#687b6d;line-height:1.8}.hint{font-size:13px;color:#87938a;margin-top:24px}.actions{justify-content:center}.status{min-height:24px;font-size:14px}details{margin-top:35px}summary{cursor:pointer}input[type=search]{width:100%;padding:13px;border:1px solid #cdd8ce;border-radius:10px;font:inherit;margin:15px 0}ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #dbe2d7}li small{display:block;color:#718473;margin-top:5px}footer{font-size:12px;color:#718473;margin-top:25px}@media(max-width:480px){header{align-items:flex-start;flex-direction:column}.card{min-height:290px}.actions button{flex:1}}
.product-image{width:230px;height:230px;max-width:100%;object-fit:contain;margin:12px 0}.product-image[hidden]{display:none}
</style>
</head>
<body>
<main>
<header><div><h1>Real Life English</h1></div><button id="update">检查更新</button><label class="import">导入词库<input id="import" type="file" accept=".json,application/json" hidden></label></header>
<div class="toolbar"><button id="all" class="primary">学习未掌握</button><button id="review">复习待记</button><button id="shuffle">随机排序</button><button id="reset">重置进度</button></div>
<div class="stats"><span id="count"></span><span id="known"></span></div>
<progress id="progress" value="0" max="1" aria-label="已掌握比例"></progress>
<p id="position"></p>
<button id="card" class="card" aria-label="显示中文答案">
<span class="label" id="label">ENGLISH</span><img id="picture" class="product-image" alt="" hidden><span id="word" class="word"></span><span id="context" class="context"></span><span id="hint" class="hint">点击卡片查看中文 · 空格翻面</span>
</button>
<div class="actions"><button id="previous">上一张</button><button id="again">还需记忆</button><button id="remember" class="primary">已掌握</button><button id="next">下一张</button></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
<details><summary>查看词库</summary><input id="search" type="search" placeholder="搜索英文或中文" aria-label="搜索词库"><ul id="list"></ul></details>
<footer>学习记录保存在当前浏览器。词库仅包含英文和中文。</footer>
</main>
<script id="builtin" type="application/json">[{"english":"Avocados","chinese":"牛油果／鳄梨"},{"english":"Raspberries","chinese":"覆盆子／树莓"},{"english":"Blackberries","chinese":"黑莓"},{"english":"Mangoes","chinese":"芒果"},{"english":"Apples","chinese":"苹果"},{"english":"Mandarins","chinese":"橘子"},{"english":"Lemons","chinese":"柠檬"},{"english":"Limes","chinese":"青柠"},{"english":"Kiwifruit","chinese":"猕猴桃／奇异果"},{"english":"Oranges","chinese":"橙子"},{"english":"Blueberries","chinese":"蓝莓"},{"english":"Grapes","chinese":"葡萄"},{"english":"Honeydew Melon","chinese":"蜜瓜"},{"english":"Papaya","chinese":"木瓜"},{"english":"Grapefruit","chinese":"葡萄柚／西柚"},{"english":"Bananas","chinese":"香蕉"},{"english":"Watermelon","chinese":"西瓜"},{"english":"Pears","chinese":"梨"},{"english":"Pineapple","chinese":"菠萝"},{"english":"Melon","chinese":"甜瓜"},{"english":"Fruit Salad","chinese":"水果沙拉"},{"english":"Rockmelon","chinese":"哈密瓜／网纹甜瓜"},{"english":"Pomegranate Arils","chinese":"石榴籽"},{"english":"Nashi Pears","chinese":"亚洲梨"},{"english":"Dragonfruit","chinese":"火龙果"},{"english":"Coconut","chinese":"椰子"},{"english":"Strawberries","chinese":"草莓"},{"english":"Pomegranate","chinese":"石榴"},{"english":"Passionfruit","chinese":"百香果"}]</script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const wordImages={"avocados":"images/avocados.jpg","raspberries":"images/raspberries.jpg","blackberries":"images/blackberries.jpg","mangoes":"images/mangoes.jpg","apples":"images/apples.jpg","mandarins":"images/mandarins.jpg","lemons":"images/lemons.jpg","limes":"images/limes.jpg","kiwifruit":"images/kiwifruit.jpg","oranges":"images/oranges.jpg","blueberries":"images/blueberries.jpg","grapes":"images/grapes.jpg","honeydew melon":"images/honeydew-melon.jpg","papaya":"images/papaya.jpg","grapefruit":"images/grapefruit.jpg","bananas":"images/bananas.jpg","watermelon":"images/watermelon.jpg","pears":"images/pears.jpg","pineapple":"images/pineapple.jpg","melon":"images/rockmelon.jpg","fruit salad":"images/fruit-salad.jpg","rockmelon":"images/rockmelon.jpg","pomegranate arils":"images/pomegranate-arils.jpg","nashi pears":"images/nashi-pears.jpg","dragonfruit":"images/dragonfruit.jpg","coconut":"images/coconut.jpg","strawberries":"images/strawberries.jpg","pomegranate":"images/pomegranate.jpg","passionfruit":"images/passionfruit.jpg","apple":"images/apples.jpg","avocado":"images/avocados.jpg","banana":"images/bananas.jpg","lemon":"images/lemons.jpg","orange":"images/oranges.jpg","pear":"images/pears.jpg"};
const wordForms={"apple":"Apples","avocado":"Avocados","banana":"Bananas","lemon":"Lemons","orange":"Oranges","pear":"Pears"};
const storageKey="real-life-english-fruit-v1";
let saved={};
try{saved=JSON.parse(localStorage.getItem(storageKey)||"{}")||{}}catch{}
let vocabulary=JSON.parse($("builtin").textContent);
let cards=[],deck=[],index=0,flipped=false,mode="all",marks=saved.marks||{};
for(const [singular,plural] of Object.entries(wordForms)){
 const key=plural.toLowerCase();
 if(marks[singular]&&!marks[key])marks[key]=marks[singular];
 delete marks[singular];
}
function parseVocabulary(data){
 if(!Array.isArray(data)||!data.length)throw Error("词库应为非空数组，每项包含 english 和 chinese。");
 const map=new Map();
 for(const term of data){
  if(!term||typeof term.english!=="string"||!term.english.trim()||typeof term.chinese!=="string"||!term.chinese.trim())throw Error("每个词需要非空 english 和 chinese。");
  const english=wordForms[term.english.trim().toLowerCase()]||term.english.trim();
  const key=english.toLowerCase();
  if(!map.has(key))map.set(key,{key,english,chinese:term.chinese.trim()});
 }
 return [...map.values()];
}
function persist(){
 try{localStorage.setItem(storageKey,JSON.stringify({marks,vocabulary}))}
 catch{$("status").textContent="浏览器无法保存记录；本次仍可学习。"}
}
function buildDeck(){
 deck=cards.filter(c=>marks[c.key]!=="known"&&(mode==="all"||marks[c.key]==="again"));
 index=0;flipped=false;render();renderList();
}
function render(){
 const mastered=cards.filter(c=>marks[c.key]==="known").length;
 $("count").textContent=cards.length+" 个核心词";
 $("known").textContent="已掌握 "+mastered+" / "+cards.length;
 $("progress").max=cards.length||1;$("progress").value=mastered;
 $("all").classList.toggle("primary",mode==="all");$("review").classList.toggle("primary",mode==="review");
 const c=deck[index];
 $("position").textContent=c?(mode==="review"?"待记复习":"学习未掌握")+" · "+(index+1)+" / "+deck.length:"当前没有待学词卡";
 $("label").textContent=flipped?"中文释义":"ENGLISH";
 $("word").textContent=c?(flipped?c.chinese:c.english):"这一轮完成了";
 const picture=$("picture"),imagePath=c?wordImages[c.key]:null;
 picture.hidden=!imagePath;
 if(imagePath){picture.src=imagePath;picture.alt=c.chinese+"商品图片"}else{picture.removeAttribute("src");picture.alt=""}
 $("context").textContent=c?"":"可切换学习未掌握，或导入新的词库。";
 $("hint").textContent=c?(flipped?"按 1 标记待记 · 按 2 标记掌握":"点击卡片查看中文 · 空格翻面"):"";
 $("card").disabled=!c;
 $("card").setAttribute("aria-label",flipped?"显示英文单词":"显示中文答案");
 for(const id of ["again","remember","shuffle"])$(id).disabled=!c;
 $("previous").disabled=!c||index===0;$("next").disabled=!c||index===deck.length-1;
}
function move(delta){index=Math.max(0,Math.min(deck.length-1,index+delta));flipped=false;render()}
function mark(value){
 const c=deck[index];if(!c)return;
 marks[c.key]=value;$("status").textContent=c.english+(value==="known"?" 已标记掌握。":" 已加入待记。");
 if(value==="known"){deck.splice(index,1);index=Math.min(index,Math.max(0,deck.length-1))}
 else if(index<deck.length-1)index++;
 flipped=false;persist();render();renderList();
}
function renderList(){
 const q=$("search").value.trim().toLowerCase();$("list").replaceChildren();
 for(const c of cards.filter(c=>marks[c.key]!=="known"&&(c.english+" "+c.chinese).toLowerCase().includes(q))){
  const li=document.createElement("li");li.textContent=c.english+" → "+c.chinese;
  $("list").append(li);
 }
}
try{if(saved.vocabulary){const previous=Array.isArray(saved.vocabulary)?saved.vocabulary:saved.vocabulary.products.flatMap(p=>p.terms);parseVocabulary(previous);vocabulary=previous}}catch{}
$("picture").onerror=()=>{$("picture").hidden=true};
cards=parseVocabulary(vocabulary);buildDeck();renderList();
$("card").onclick=()=>{flipped=!flipped;render()};
$("previous").onclick=()=>move(-1);$("next").onclick=()=>move(1);
$("again").onclick=()=>mark("again");$("remember").onclick=()=>mark("known");
$("all").onclick=()=>{mode="all";buildDeck()};$("review").onclick=()=>{mode="review";buildDeck()};
$("shuffle").onclick=()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;flipped=false;render()};
$("reset").onclick=()=>{if(confirm("重置所有词汇的学习进度？")){marks={};persist();buildDeck();$("status").textContent="学习进度已重置。"}};
$("search").oninput=renderList;
$("update").onclick=async()=>{
 if(window.AndroidApp&&typeof window.AndroidApp.checkUpdates==="function"){
  window.AndroidApp.checkUpdates();return;
 }
 $("update").disabled=true;$("status").textContent="正在查询最新 Android 版本…";
 try{
  const response=await fetch("https://api.github.com/repos/Qiumu0o0/RealLifeEnglish/releases/latest");
  if(!response.ok)throw Error("查询失败");
  const release=await response.json();
  const asset=release.assets.find(a=>a.name==="RealLifeEnglish.apk");
  if(!asset||!asset.browser_download_url.startsWith("https://github.com/Qiumu0o0/RealLifeEnglish/releases/download/"))throw Error("暂无安装包");
  $("status").textContent="最新 Android 版本 "+release.tag_name+" · ";
  const link=document.createElement("a");link.textContent="下载 APK";link.href=asset.browser_download_url;
  $("status").append(link);
 }catch{$("status").textContent="检查失败，请检查网络或稍后重试。"}
 finally{$("update").disabled=false}
};
$("import").onchange=async event=>{
 const file=event.target.files[0];if(!file)return;
 try{
  const data=JSON.parse((await file.text()).replace(/^\uFEFF/,""));const parsed=parseVocabulary(data);
  vocabulary=data;cards=parsed;mode="all";persist();buildDeck();renderList();$("status").textContent="已导入 "+cards.length+" 个核心词。";
 }catch(error){$("status").textContent="导入失败："+error.message}
 event.target.value="";
};
document.addEventListener("keydown",event=>{
 if(event.target.matches("input,textarea,button")||event.ctrlKey||event.altKey||event.metaKey)return;
 if(event.code==="Space"){event.preventDefault();if(deck.length){flipped=!flipped;render()}}
 if(event.key==="ArrowRight")move(1);if(event.key==="ArrowLeft")move(-1);
 if(event.key==="1")mark("again");if(event.key==="2")mark("known");
});
</script>
</body>
</html>
