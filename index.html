<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Life English · 生活词卡</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#20392c;background:#f5f7f1}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:36px 20px}header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}h1{font-size:25px;margin:0}p{line-height:1.6;color:#64766a}button,.import{font:inherit;border:1px solid #cdd8ce;border-radius:12px;padding:12px 16px;cursor:pointer;background:white;color:#20392c}button:disabled{opacity:.45;cursor:default}button.primary{background:#285c3c;color:white;border-color:#285c3c}.toolbar,.actions,.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stats{justify-content:space-between;font-size:14px}progress{width:100%;height:9px;accent-color:#285c3c}.card{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:320px;background:#fff;border:1px solid #dbe2d7;border-radius:24px;padding:30px;box-shadow:0 10px 35px #264b3110;text-align:center}.label{font-size:13px;letter-spacing:2px;color:#718473}.word{font-size:clamp(26px,6vw,46px);font-weight:650;margin:22px 0}.context{font-size:15px;color:#687b6d;line-height:1.8}.hint{font-size:13px;color:#87938a;margin-top:24px}.actions{justify-content:center}.status{min-height:24px;font-size:14px}details{margin-top:35px}summary{cursor:pointer}input[type=search]{width:100%;padding:13px;border:1px solid #cdd8ce;border-radius:10px;font:inherit;margin:15px 0}ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #dbe2d7}li small{display:block;color:#718473;margin-top:5px}footer{font-size:12px;color:#718473;margin-top:25px}@media(max-width:480px){header{align-items:flex-start;flex-direction:column}.card{min-height:290px}.actions button{flex:1}}
.product-image{width:230px;height:230px;max-width:100%;object-fit:contain;margin:12px 0}.product-image[hidden]{display:none}
@media (hover:hover) and (pointer:fine){button:hover:not(:disabled),.import:hover{background:#eaf0e5}.card:hover:not(:disabled){background:#fff}}
button:focus-visible{outline:2px solid #285c3c;outline-offset:3px}
.category-picker{display:flex;align-items:center;gap:12px;margin:24px 0 12px}.category-picker select{flex:1;min-width:0;padding:12px;border:1px solid #cdd8ce;border-radius:12px;background:white;font:inherit;color:#20392c}
@media(max-width:480px){main{padding:20px 16px}header{flex-direction:row;align-items:center}header>div{flex-basis:100%}header>button,header>.import{text-align:center;flex:1}.toolbar{margin:14px 0}.toolbar button{flex:1 1 40%;padding:10px;font-size:14px}.stats{margin:14px 0}.category-picker{margin-top:18px}.card{padding:20px}.product-image{width:190px;height:190px;margin:8px 0}.word{margin:12px 0}.hint{margin-top:12px}}
@media(max-width:480px){.actions{gap:8px}.actions button{padding:10px 8px;font-size:14px;white-space:nowrap}}
</style>
<script src="bootstrap.js"></script>
</head>
<body>
<main>
<header><div><h1>Real Life English</h1></div><button id="update">检查更新</button><label class="import">导入词库<input id="import" type="file" accept=".json,application/json" hidden></label></header>
<label class="category-picker" for="category">商品分类<select id="category" aria-label="商品分类"></select></label>
<div class="toolbar"><button id="all" class="primary">学习未掌握</button><button id="review">复习待记</button><button id="shuffle">随机排序</button><button id="reset">重置进度</button></div>
<div class="stats"><span id="count"></span><span id="known"></span></div>
<progress id="progress" value="0" max="1" aria-label="已掌握比例"></progress>
<p id="position"></p>
<button id="card" class="card" aria-label="显示中文答案">
<span class="label" id="label">ENGLISH</span><img id="picture" class="product-image" alt="" hidden><span id="word" class="word"></span><span id="context" class="context"></span><span id="hint" class="hint">点击卡片查看中文 · 空格翻面</span>
</button>
<div class="actions"><button id="previous">上一张</button><button id="again">还需记忆</button><button id="remember" class="primary">已掌握</button><button id="next">下一张</button></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
<details><summary>查看词库</summary><input id="search" type="search" placeholder="搜索英文或中文" aria-label="搜索词库"><ul id="list"></ul></details>
<footer>学习记录保存在当前设备。同词同义共享掌握状态。</footer>
</main>
<script src="data/app-catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
